  [[sym.notes]]
  text = "**The trap this cost CAPTURE:** one save path called `0x40024168` without first setting these globals, and the stock writer produced a header-only WAV — a file that exists, has a correct RIFF/WAVE header, and carries no audio, which reads as \"the write succeeded\" until the file is opened. Setting `0x460be9e8` (kind) and `0x460be9ec` (object) before each storage job made the stock path write real audio on the MKI. Any module that drives a storage job through this entry point, rather than calli..."
