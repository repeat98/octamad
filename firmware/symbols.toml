  [[sym.notes]]
  text = "✅ `docs/firmware/SAMPLE_SAVE.md`. The writer at `0x40020f04` builds a 44-byte header, walks the sample pool in 3,072-byte pieces, converts through the 16-bit or 24-bit converter, and writes through a 64 KB buffered file API. It accepts recorder buffers as sources. The file API underneath has been used from a detour to create files on the card, on hardware, by octamax."
