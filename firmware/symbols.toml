[[sym]]
addr = "0x40008498"
name = ""
kind = "unknown"
confidence = "doc"

  [[sym.notes]]
  text = "The phase accumulator is a 64-bit signed value (voice+0x78/0x7c) that drives sample position advancement. Per output sample, it is decremented by the 64-bit pitch ratio. When the result goes negative, the integer position advances and the modulo is added back. The inner loop (`0x40008498–0x400084a2`) repeats the modulo addition until the phase is non-negative, supporting pitch ratios larger than the modulo (faster playback)."
  source = "docs/TIMESTRETCH_PIPELINE.md:61"
  date = "2026-09-22"

