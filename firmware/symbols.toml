  [[sym.notes]]
  text = "`0x40024168` is a **different** entry point from `0x40020f04` above: it is driven by a **kind** at RAM global `0x460be9e8` and an **object** at `0x460be9ec` instead of an explicit slot/trim argument list, and it is the one a storage job (SAVE, in octalab's case CAPTURE) reaches. 🟡 Not yet disassembled to the same depth as `0x40020f04`; the finding is the calling convention, established by CAPTURE's own failure mode."
  source = "docs/firmware/SAMPLE_SAVE.md:48"
  date = "2026-09-22"

  [[sym.notes]]
  text = "**The trap this cost CAPTURE:** one save path called `0x40024168` without first setting these globals, and the stock writer produced a header-only WAV — a file that exists, has a correct RIFF/WAVE header, and carries no audio, which reads as \"the write succeeded\" until the file is opened. Setting `0x460be9e8` (kind) and `0x460be9ec` (object) before each storage job made the stock path write real audio on the MKI. Any module that drives a storage job through this entry point, rather than calli..."
  source = "docs/firmware/SAMPLE_SAVE.md:64"
  date = "2026-09-22"

