  text = "**CC map** (handler `0x4000e79c`): CC 16-45 → `idx = cc−16` (bounds `< 30`), posted as kind `0x40` to the kernel queue `0x460d17ae`; consumer `0x40062496` maps `idx/6` through `{0,2,1,3,4}` to page_kind, `flat = page_kind·6 + idx%6`. CC 40-45 = FX2 slots 0-5 (page 1). Other CCs: 7/46 level, 47 cue, 8 AMP BAL, 48 crossfader, 49-51 mute/solo/cue, 52-54 arm, 55/56 scene select, 59/60 synth note on/off, 61 send request, 112-127 → `0x8000000c`. Unused: 0-6, 9-15, 62-111."
  source = "docs/firmware/MIDI.md:18"
  date = "2026-09-22"

  [[sym.notes]]
  text = "``` UART bytes → (parser task) → queue 0x46c7e974 → MIDI-in task 0x40005540 → dispatch table 0x400d6474[status>>4] → CC handler 0x4000e79c → post {kind,track,idx,value} to kernel queue 0x460d17ae (poster 0x400053d8) → main/UI task loop 0x40061cd2 → jump table 0x40061cfa[kind-1] → kind 0x40 → 0x40062496 → param writer 0x40054cd8(track, flat, value) → Part storage + live byte 0x80000810[track*72 + flat] + dirty marker ```"
  source = "docs/firmware/MIDI.md:174"
